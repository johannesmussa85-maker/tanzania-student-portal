<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mineral Processing Books | Tanzania Student Portal</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f5ff;
            margin: 0;
            padding: 20px;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            background: #0756a8;
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }

        .search-box {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            text-align: center;
        }

        input {
            width: 70%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            background: #0756a8;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 5px;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .book {
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .book img {
            width: 100%;
            height: 280px;
            object-fit: contain;
            background: #eee;
            border-radius: 8px;
        }

        .book h2 {
            color: #0756a8;
            font-size: 18px;
        }

        .book p {
            font-size: 14px;
        }

        .book a {
            color: #0756a8;
            font-weight: bold;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            background: #0756a8;
            color: white;
            padding: 12px 18px;
            border-radius: 6px;
            text-decoration: none;
        }

        #status {
            text-align: center;
            margin: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📚 Mineral Processing Books</h1>

    <div class="search-box">
        <input
            type="text"
            id="searchInput"
            value="mineral processing"
            placeholder="Search for a book..."
        >

        <button onclick="searchBooks()">Search</button>
    </div>

    <div id="status">Loading books...</div>

    <div id="books" class="books"></div>

    <a class="back" href="index.html">← Back to Home</a>

</div>

<script>

async function searchBooks() {

    const query = document.getElementById("searchInput").value;
    const booksContainer = document.getElementById("books");
    const status = document.getElementById("status");

    booksContainer.innerHTML = "";
    status.textContent = "Loading books...";

    try {

        const response = await fetch(
            "https://openlibrary.org/search.json?q=" +
            encodeURIComponent(query) +
            "&limit=20"
        );

        const data = await response.json();

        if (!data.docs || data.docs.length === 0) {
            status.textContent = "No books found.";
            return;
        }

        status.textContent = data.docs.length + " books found";

        data.docs.forEach(book => {

            const title = book.title || "Unknown title";

            const author =
                book.author_name
                ? book.author_name.join(", ")
                : "Unknown author";

            const year =
                book.first_publish_year || "Unknown year";

            const cover = book.cover_i
                ? "https://covers.openlibrary.org/b/id/" +
                  book.cover_i +
                  "-M.jpg"
                : "https://via.placeholder.com/180x260?text=No+Cover";

            const bookKey = book.key || "";

            const bookLink =
                "https://openlibrary.org" + bookKey;

            const card = document.createElement("div");

            card.className = "book";

            card.innerHTML = `
                <img src="${cover}" alt="${title} cover">

                <h2>${title}</h2>

                <p><strong>Author:</strong> ${author}</p>

                <p><strong>First published:</strong> ${year}</p>

                <p>
                    <a href="${bookLink}"
                       target="_blank"
                       rel="noopener">
                        View Book
                    </a>
                </p>
            `;

            booksContainer.appendChild(card);

        });

    } catch (error) {

        status.textContent =
            "Unable to load books. Please try again.";

        console.error(error);
    }
}

searchBooks();

</script>

</body>
</html>
