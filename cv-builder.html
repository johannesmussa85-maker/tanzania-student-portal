<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CV Builder | Tanzania Student Portal</title>
<style>body{font-family:Arial;background:#f6f8fc;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:30px 5%}h1{color:#1e3a8a}form,.preview{background:#fff;padding:25px;border-radius:12px;box-shadow:0 4px 15px #0001;margin:18px 0}label{display:block;font-weight:bold;margin:13px 0 6px}input,textarea{width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:8px;box-sizing:border-box}textarea{min-height:90px}button,a{display:inline-block;padding:11px 16px;border:0;border-radius:8px;background:#1e3a8a;color:#fff;text-decoration:none;font-weight:bold;margin:8px 5px 0 0;cursor:pointer}.preview{line-height:1.5}.preview h2{color:#1e3a8a;margin-bottom:2px}.muted{color:#64748b}@media print{form,.actions{display:none}.wrap{padding:0}.preview{box-shadow:none}}</style></head>
<body><div class="wrap"><a href="index.html">← Home</a><h1>📄 Student CV Builder</h1><p class="muted">Fill in your details, preview your CV, then print or save it as PDF.</p>
<form id="cvForm"><label>Full name</label><input id="name" required><label>Email</label><input id="email" type="email"><label>Phone</label><input id="phone"><label>Education</label><textarea id="education" placeholder="Example: Diploma in Mining Engineering — Jema Institute of Technology"></textarea><label>Skills</label><textarea id="skills" placeholder="Example: Communication, teamwork, computer skills"></textarea><label>Experience</label><textarea id="experience"></textarea><label>Profile / Career objective</label><textarea id="profile"></textarea><button type="button" onclick="buildCV()">Generate CV</button></form>
<div class="preview" id="preview"><h2>Your CV Preview</h2><p class="muted">Complete the form and select Generate CV.</p></div><div class="actions"><button onclick="window.print()">Print / Save as PDF</button></div></div>
<script>function buildCV(){const v=id=>document.getElementById(id).value.trim();document.getElementById('preview').innerHTML='<h2>'+esc(v('name'))+'</h2><p>'+esc(v('email'))+' · '+esc(v('phone'))+'</p><hr><h3>PROFILE</h3><p>'+nl(esc(v('profile')))+'</p><h3>EDUCATION</h3><p>'+nl(esc(v('education')))+'</p><h3>SKILLS</h3><p>'+nl(esc(v('skills')))+'</p><h3>EXPERIENCE</h3><p>'+nl(esc(v('experience')))+'</p>'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function nl(s){return s.replace(/\n/g,'<br>')}</script></body></html>
