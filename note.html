<script>
const notes=[
["Mineral Processing","Mineral processing is the treatment of ore to separate valuable minerals from unwanted gangue. Main stages include ore characterization, comminution, screening and classification, concentration, and dewatering.","Key areas","Ore characterization helps identify mineral composition, liberation size, hardness and other properties. Comminution reduces particle size through crushing and grinding. Screening separates particles by size, while classification uses fluid or other methods to separate particles according to settling or size behavior. Concentration may use gravity, magnetic separation or flotation depending on mineral properties. Dewatering removes water from concentrates or tailings. Important performance measures include grade, recovery and mass yield."],
["Mining Engineering","Mining engineering applies engineering principles to the exploration, planning, extraction and management of mineral resources.","Key areas","Important topics include mineral exploration, mine planning, surface and underground mining, drilling and blasting, mine ventilation, ground control, production planning, occupational safety and environmental management. A good mine plan considers geology, rock conditions, equipment, economics, safety and environmental requirements."],
["Civil Engineering","Civil engineering deals with the planning, design, construction and maintenance of infrastructure.","Key areas","Core areas include engineering materials, surveying, structural engineering, soil mechanics, foundations, fluid mechanics, hydraulics, transportation and construction management. Engineers use calculations, drawings, specifications and site investigations to produce safe and functional infrastructure."],
["Electrical Engineering","Electrical engineering focuses on electrical energy, circuits, machines, power systems, control and measurement.","Key areas","Basic concepts include voltage, current, resistance and power. Ohm's law relates voltage, current and resistance. AC and DC systems have different characteristics. Transformers change AC voltage levels, while motors convert electrical energy into mechanical energy. Electrical safety, measurement and protection are essential in practical systems."],
["Mechanical Engineering","Mechanical engineering studies machines, energy, motion, materials and manufacturing systems.","Key areas","Major areas include engineering mechanics, thermodynamics, fluid mechanics, heat transfer, machine elements, manufacturing, materials and maintenance. Mechanical design combines scientific principles with material selection, safety, efficiency, cost and reliability."],
["Computer Science","Computer science studies computation, algorithms, software and information systems.","Key areas","Important foundations include programming, algorithms, data structures, databases, operating systems, computer networks and software engineering. Algorithm efficiency can be analyzed using computational complexity. Cybersecurity fundamentals help protect systems, data and users."],
["Computer Applications","Computer applications focus on using digital tools effectively for academic, office and professional work.","Key areas","Students commonly use word processors for documents, spreadsheets for calculations and data analysis, presentation software for communication, databases for structured information and cloud tools for collaboration. Good file organization, backups, privacy and data protection are important digital skills."],
["Information & Communication Technology (ICT)","ICT combines computing and communication technologies used to create, store, process and exchange information.","Key areas","Topics include computer networks, internet architecture, IP addressing, web technologies, information systems, databases and cybersecurity. ICT also supports digital services, communication, collaboration and information management."],
["Computer Engineering","Computer engineering combines computer hardware, electronics and software.","Key areas","Core concepts include binary systems, digital logic, computer organization, processors, memory, embedded systems, microcontrollers and hardware interfacing. Engineers work across the boundary between electronic hardware and computer-based systems."],
["Business & Finance","Business and finance study how organizations create value, manage resources and make financial decisions.","Key areas","Foundations include accounting, financial statements, budgeting, financial management, economics, marketing, management and entrepreneurship. Financial decisions require attention to revenue, costs, cash flow, risk and long-term objectives."],
["Health Sciences","Health sciences study human health, disease prevention, health promotion and healthcare practice.","Key areas","Foundations include cells and tissues, anatomy and physiology, homeostasis, nutrition, infection prevention and public health. Evidence-based practice uses reliable research and appropriate evidence to support health decisions."],
["Education","Education studies how people learn and how teaching can be planned, delivered and assessed.","Key areas","Important topics include learning theories, teaching methods, curriculum, lesson planning, classroom management, assessment and inclusive education. Educational technology can support communication, learning activities and access to resources."],
["Agriculture","Agriculture applies science and management to crop, livestock and natural-resource production.","Key areas","Core areas include soil science, crop production, plant nutrition, pests and diseases, irrigation, agricultural machinery, livestock, farm management and sustainability. Good agricultural practice aims to improve productivity while conserving soil, water and other resources."],
["Law & Social Sciences","Law and social sciences examine rules, institutions, society, human relationships and social decision-making.","Key areas","Students study sources of law, legal reasoning, rights and duties, institutions, research methods, sociology and economics. Critical analysis, evidence, ethics and clear argument are important across these disciplines."],
["Tourism & Hospitality","Tourism and hospitality focus on travel, destinations, accommodation, food service and customer experience.","Key areas","Topics include tourism systems, destination management, hospitality operations, customer service, accommodation, food service, marketing and sustainable tourism. Service quality, safety and responsible destination management are important for long-term success."]
];
const params=new URLSearchParams(location.search), i=Math.max(0,Math.min(notes.length-1,parseInt(params.get("course")||"0",10)||0)), n=notes[i];
document.getElementById("title").textContent="📖 "+n[0];
document.getElementById("content").innerHTML="<h2>"+n[2]+"</h2><p>"+n[3]+"</p>";
document.getElementById("prev").href="note.html?course="+(i===0?notes.length-1:i-1);
document.getElementById("next").href="note.html?course="+((i+1)%notes.length);
</script>
